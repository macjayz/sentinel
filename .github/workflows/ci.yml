name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f infra/node.Dockerfile --build-arg WORKSPACE=apps/api -t sentinel-api:ci .

      - name: Build worker image
        run: docker build -f infra/node.Dockerfile --build-arg WORKSPACE=apps/worker -t sentinel-worker:ci .

      - name: Build dashboard image
        run: docker build -f infra/dashboard.Dockerfile -t sentinel-dashboard:ci .
