services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
      args:
        WORKSPACE: apps/api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      SENTINEL_API_KEY: dev-sentinel-key
      # These three flags default to disabled whenever NODE_ENV=production (which the API's own
      # Dockerfile sets). They're explicit here, not just relying on that default, because they're
      # what makes `docker compose up --build` usable out of the box: a demo login, the shared dev
      # API key, and sample traffic so the dashboard isn't empty on first boot. Removing them is
      # safe (the stack still runs) but breaks the zero-config demo experience for new users. Do not
      # set any of these to "true" on a real deployment you're exposing publicly.
      SENTINEL_ALLOW_DEV_FALLBACK_KEY: "true"
      SENTINEL_BOOTSTRAP_DEMO_USER: "true"
      SENTINEL_SEED_DEMO_EVENTS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
      args:
        WORKSPACE: apps/worker
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: infra/dashboard.Dockerfile
    environment:
      VITE_SENTINEL_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  sentinel-postgres:
